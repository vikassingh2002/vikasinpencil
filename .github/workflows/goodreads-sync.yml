# Copies your Goodreads shelves into content/books.js every morning.
# Nothing to do day to day: read, rate and review on Goodreads as usual.
# To sync right now: GitHub -> Actions -> "Sync Goodreads" -> Run workflow.
name: Sync Goodreads

on:
  schedule:
    - cron: "30 0 * * *" # 06:00 India time, every day
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: goodreads-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch the shelves from Goodreads
        run: python3 tools/goodreads_sync.py

      - name: Publish if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- content/books.js; then
            echo "Goodreads hasn't changed since the last sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/books.js
          git commit -m "Sync library from Goodreads"
          git push
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" > /dev/null || echo "Pages will rebuild from the push."
