# Copies your Goodreads shelves into content/books.js and looks up any new
# links in the log of content/references.js for their titles and pictures.
# It no longer runs on a schedule (the Goodreads profile is private, and
# the library is updated by hand on request). To run it anyway:
# GitHub -> Actions -> "Sync Goodreads" -> Run workflow.
name: Sync Goodreads

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: goodreads-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Get Pillow, to colour each spine like its cover
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --disable-pip-version-check pillow || echo "No Pillow today: the spine colours carry over."

      - name: Fetch the shelves from Goodreads
        run: .venv/bin/python tools/goodreads_sync.py

      - name: Look up the links in the log
        run: .venv/bin/python tools/links_sync.py

      - name: Publish if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add --all -- content assets
          if git diff --cached --quiet; then
            echo "Nothing has changed since the last sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync library from Goodreads"
          git push
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" > /dev/null || echo "Pages will rebuild from the push."
