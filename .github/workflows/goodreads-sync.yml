# Copies your Goodreads shelves into content/books.js every morning, and
# looks up any new links in the log of content/references.js (films,
# articles, videos, podcasts) for their titles and pictures.
# Nothing to do day to day: read, rate and review on Goodreads as usual.
# To sync right now: GitHub -> Actions -> "Sync Goodreads" -> Run workflow.
name: Sync Goodreads

on:
  schedule:
    - cron: "30 0 * * *" # 06:00 India time, every day
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: goodreads-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Get Pillow, to colour each spine like its cover
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --disable-pip-version-check pillow || echo "No Pillow today: the spine colours carry over."

      - name: Fetch the shelves from Goodreads
        run: .venv/bin/python tools/goodreads_sync.py

      - name: Look up the links in the log
        run: .venv/bin/python tools/links_sync.py

      - name: Publish if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add --all -- content assets
          if git diff --cached --quiet; then
            echo "Nothing has changed since the last sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync library from Goodreads"
          git push
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" > /dev/null || echo "Pages will rebuild from the push."
